name: QA Automation CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      -  name: Install minimal dependencies
         run: |
          python -m pip install pytest

      - name: Run pytest
        run: |
          pytest -k test_search_automobile_first_news_title -s
